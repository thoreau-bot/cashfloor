<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f6df6"/>
      <stop offset="1" stop-color="#1b3fa6"/>
    </linearGradient>
  </defs>
  <!-- tile -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <!-- floor: the lowest point the balance will touch -->
  <line x1="104" y1="356" x2="408" y2="356" stroke="#ffc857" stroke-width="28" stroke-linecap="round"/>
  <!-- balance line: dips to the floor, recovers -->
  <path d="M104 168 C 150 168, 170 236, 206 300 C 232 346, 252 356, 268 356 C 292 356, 320 280, 352 236 C 376 204, 392 196, 408 196"
        fill="none" stroke="#ffffff" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- floor marker -->
  <circle cx="268" cy="356" r="30" fill="#ffffff"/>
  <circle cx="268" cy="356" r="16" fill="#ff6b6b"/>
</svg>
